# Deprovisioning (spec 001-migracion-aws, HU-4, RF-010): manual only, with explicit confirmation.
# Removes everything Terraform manages here: the CloudFront distribution (disabled first, ~5-15 min), its function and
# OAC, and the bucket with the published files (force_destroy: the content is rebuilt from the commit).
# Bootstrap resources (OIDC, workflow role, state bucket), the shared platform and the microservices are not touched
# (constitution P2).
name: Deprovision

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe urban-alert-web para confirmar que quieres eliminar el sitio"
        required: true
        type: string

concurrency:
  group: urban-alert-web-aws
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"

jobs:
  deprovision:
    name: Deprovision site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "urban-alert-web" ]; then
            echo "::error::Confirmation missing: type urban-alert-web. Nothing was deleted."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main (the AWS role only trusts main). Nothing was deleted."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Destroy site
        run: |
          terraform -chdir=infra/web init -input=false
          if [ -z "$(terraform -chdir=infra/web state list)" ]; then
            echo "Web stack is already empty: nothing to delete."
          else
            terraform -chdir=infra/web destroy -input=false -auto-approve
          fi
          {
            echo "### Sitio eliminado"
            echo "- Para recrearlo: haz un commit a \`main\` (workflow Provision)."
          } >> "$GITHUB_STEP_SUMMARY"
